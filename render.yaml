# Render Blueprint for Inventory Health (free tier to start).
# Upgrade later in the Render dashboard: web "free" -> "starter", database "free" -> "basic-256mb".
services:
  - type: web
    name: inventory-health
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-health-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false # Dev Dashboard > Inventory Health > Settings > Client ID
      - key: SHOPIFY_API_SECRET
        sync: false # Dev Dashboard > Inventory Health > Settings > Secret
      - key: SHOPIFY_APP_URL
        sync: false # this service's https://...onrender.com address
      - key: SCOPES
        value: read_products,read_inventory,read_locations,read_reports
      - key: SHOP_DOMAIN
        value: corporategotem.myshopify.com
      - key: JOB_TOKEN
        generateValue: true # also saved as a GitHub secret for the nightly sync

databases:
  - name: inventory-health-db
    plan: free
    region: ohio
    databaseName: inventory_health
    user: inventory_health
